# Окружение разработки: docker compose up
# Postgres + Redis + Django (runserver) + Vite dev-server с HMR.
# nginx и gunicorn здесь не нужны — они в docker-compose.prod.yml.

name: dachpedigrees

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dachs}
      POSTGRES_USER: ${POSTGRES_USER:-dachs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dachs}
      # C.UTF-8 вместо локали по умолчанию: предсказуемая сортировка кличек
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dachs} -d ${POSTGRES_DB:-dachs}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_VITE_DEV_MODE: "1"
      DJANGO_VITE_DEV_HOST: localhost
      DJANGO_VITE_DEV_PORT: "5173"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-dachs}
      POSTGRES_USER: ${POSTGRES_USER:-dachs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dachs}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RUN_MIGRATIONS: "1"
      # том смонтирован сюда же — см. volumes ниже
      DJANGO_MEDIA_ROOT: /var/app/media
    volumes:
      # правки кода видны сразу, без пересборки образа
      - ./backend:/app
      - media:/var/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    volumes:
      - ./frontend:/app/frontend
      # node_modules из образа не затираются примонтированной папкой
      - /app/frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  pgdata:
  media:
